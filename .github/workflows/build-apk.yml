name: Build LocalOCR APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-unsigned-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          cp "$BT/apksigner" "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          find "$ANDROID_HOME" -name "libc++.so" -print -quit | xargs -r -I{} cp "{}" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools/
          retention-days: 1
