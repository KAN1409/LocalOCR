name: Build LocalOCR APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official PaddleOCR Android SDK and Arabic models
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PaddlePaddle/PaddleOCR.git vendor/PaddleOCR
          git -C vendor/PaddleOCR checkout dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf -- deploy/ppocr-android/ppocr-sdk
          cp ppocr-sdk.gradle.kts vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/build.gradle.kts
          mkdir -p vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/{det,rec}
          curl -L --fail --retry 3 -o vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/det/inference.onnx "https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 3 -o vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.onnx "https://huggingface.co/PaddlePaddle/arabic_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 3 -o vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.yml "https://huggingface.co/PaddlePaddle/arabic_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.yml?download=true"
          echo "a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d  vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/det/inference.onnx" | sha256sum -c -
          echo "799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110  vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.onnx" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LocalOCR-unsigned-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          cp "$BT/apksigner" "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          find "$ANDROID_HOME" -name "libc++.so" -print -quit | xargs -r -I{} cp "{}" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools/
          retention-days: 1
